appId: org.scottishtecharmy.soundscape
# Exercises the free-text search bar on Home: expand it, type a query, tap a
# result (lands on Location Details), then a second pass that cancels out via
# the back button instead of selecting a result.
#
# The text field only searches on the IME "search" action (BasicTextField's
# KeyboardActions.onSearch), not on every keystroke - inputText alone never
# triggers a search, so it must be followed by pressKey: Enter.
#
# Search mode is forced to Offline first: from GitHub Actions the debug build
# has no search provider URL configured, so the (default) online geocoder mode
# can't resolve anything - only the pinned Glasgow offline extract fixture
# (same one PlacesNearby.yaml/LocationDetails.yaml rely on) is searchable, via
# generic terms like "Road"/"Street" rather than city names.
---
- launchApp:
    clearState: false

- runFlow:
    file: WaitForScreen.yaml
    env:
      screen: Home

- tapOn:
    id: topBarMenu
- tapOn:
    id: menuSettings
- runFlow:
    file: WaitForScreen.yaml
    env:
      screen: Settings
- runFlow:
    file: SwipeAndTap.yaml
    env:
      id: settingsSectionSearch
- runFlow:
    file: SwipeAndTap.yaml
    env:
      id: settingsGeocoderModeRow
      direction: down
- tapOn: "Offline"
- tapOn:
    id: appBarLeft

- runFlow:
    file: WaitForScreen.yaml
    env:
      screen: Home

- tapOn:
    id: mainSearchBarCollapsed
- tapOn:
    id: mainSearchBarTextField
- inputText: "Road"
- pressKey: Enter

- runFlow:
    file: Wait.yaml
    env:
      timeout: 10000

- assertVisible:
    id: "LocationItem-.*"
- tapOn:
    id: "LocationItem-.*"

- runFlow:
    file: WaitForScreen.yaml
    env:
      screen: LocationDetails

- tapOn:
    id: appBarLeft

# Second pass: open search, type, then cancel out via the back button instead
# of selecting a result.
- runFlow:
    file: WaitForScreen.yaml
    env:
      screen: Home
- tapOn:
    id: mainSearchBarCollapsed
- tapOn:
    id: mainSearchBarTextField
- tapOn:
    id: mainSearchBarClearButton
- inputText: "Street"
- pressKey: Enter
- runFlow:
    file: Wait.yaml
    env:
      timeout: 10000
- tapOn:
    id: mainSearchBarBackButton
