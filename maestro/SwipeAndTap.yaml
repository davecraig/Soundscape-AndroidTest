appId: org.scottishtecharmy.soundscape
# Scrolls a possibly off-screen or partially-visible element into view, then taps
# it. Pass the element id and a direction:
#
#   - runFlow:
#       file: SwipeAndTap.yaml
#       env:
#         id: someTestTag
#         direction: up     # 'up' reveals items below the fold (default),
#                           # 'down' reveals items above.
#
# We deliberately don't use scrollUntilVisible: it swipes from the screen centre
# (which on the home screen is the non-scrollable map), and Maestro treats a
# partially-visible element as fully visible - so it stops before the element is
# actually tappable and the tap lands on a clipped control. Instead we swipe the
# scrollable part of the screen in small steps until the element appears, nudge
# it clear of the edge, then tap.
#
# The nudge swipe can land on an inner scrollable list (e.g. the audio beacon
# list) rather than the outer page; that scrolls a fully-visible target back out
# of view. So after nudging we check the target is still visible and, if not,
# reverse the nudge to put it back - a partially-clipped target stays visible and
# is left as nudged.
#
# Note: swipe start/end coordinates can't be supplied via ${} variables (Maestro
# parses them as literals and throws a number-format error), so the per-direction
# coordinates are hard-coded below and selected with `when` conditions.
#
# The search-loop swipe's bottom-most point is 70%, not 80%: at 80% on a short
# screen, a swipe starting there was landing inside the system's bottom
# gesture-navigation zone and got interpreted as a "go home" swipe instead of
# an in-app scroll (visible in logcat as a WindowManagerShell "TO_BACK"/
# "QuickstepLaunchHome" transition, backgrounding the app entirely) -
# reproduced deterministically scrolling to a low item in a long expanded
# Settings section on a small/short device profile.
---
# Validate the direction (defaulting to 'up') and stash it for the conditions
# below.
- evalScript: |
    ${
      output.swipeFound = 0;
      output.swipeTries = 0;
      const dir = (typeof direction === 'undefined' || direction === '') ? 'up' : direction;
      if (dir !== 'up' && dir !== 'down') {
        throw 'SwipeAndTap: direction must be "up" or "down", got "' + dir + '"';
      }
      output.swipeDir = dir;
    }

# If it's already on screen we don't need to scroll or nudge - it's just
# tapped directly at the end. Nudging something already comfortably visible
# was observed to sometimes overscroll a short list (e.g. the drawer) far
# past the target, landing the swipe as a fling rather than a small drag -
# harmless for a list with room to spare, but for an element near the very
# top of a short scrollable it can scroll the target out of view entirely
# before the tap fires. So swipeNeeded (gating the nudge below) is only set
# inside the search loop, never by this fast-path check.
- runFlow:
    when:
      visible:
        id: ${id}
    commands:
      - evalScript: ${output.swipeFound = 1}

# Swipe in small steps until the element shows up or we run out of tries. If it
# never appears, the tapOn below fails loudly.
- repeat:
    while:
      true: "${output.swipeFound == 0 && output.swipeTries < 15}"
    commands:
      # 'up' reveals items below the fold (swipe the finger up).
      - runFlow:
          when:
            true: "${output.swipeDir == 'up'}"
          commands:
            - swipe:
                start: 50%, 70%
                end: 50%, 50%
      # 'down' reveals items above (swipe the finger down).
      - runFlow:
          when:
            true: "${output.swipeDir == 'down'}"
          commands:
            - swipe:
                start: 50%, 50%
                end: 50%, 70%
      - evalScript: ${output.swipeTries = output.swipeTries + 1}
      - runFlow:
          when:
            visible:
              id: ${id}
          commands:
            - evalScript: |
                ${
                  output.swipeFound = 1;
                  output.swipeNeeded = 1;
                }

# Nudge the element away from the edge it was revealed at, so a partially-visible
# item is fully tappable rather than clipped. Only when scrolling actually
# happened (swipeNeeded) - see the note above.
- runFlow:
    when:
      true: "${output.swipeNeeded == 1 && output.swipeDir == 'up'}"
    commands:
      - swipe:
          start: 50%, 75%
          end: 50%, 60%
- runFlow:
    when:
      true: "${output.swipeNeeded == 1 && output.swipeDir == 'down'}"
    commands:
      - swipe:
          start: 50%, 60%
          end: 50%, 75%

# If the nudge landed on an inner scrollable list it can scroll a fully-visible
# target back out of view. If the target is no longer visible, reverse the nudge
# (the opposite swipe) to restore it. A normally partially-clipped target stays
# visible after the nudge, so this reverse is skipped for it.
- runFlow:
    when:
      true: "${output.swipeNeeded == 1 && output.swipeDir == 'up'}"
      notVisible:
        id: ${id}
    commands:
      - swipe:
          start: 50%, 60%
          end: 50%, 75%
- runFlow:
    when:
      true: "${output.swipeNeeded == 1 && output.swipeDir == 'down'}"
      notVisible:
        id: ${id}
    commands:
      - swipe:
          start: 50%, 75%
          end: 50%, 60%

- tapOn:
    id: ${id}
