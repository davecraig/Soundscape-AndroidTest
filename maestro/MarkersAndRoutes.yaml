appId: org.scottishtecharmy.soundscape
# Exercises the Markers & Routes management screen: tab switching, the sort
# controls, and editing an existing marker.
#
# Depends on markers "A" and "B" having been created by LocationDetails.yaml,
# and on "Test Route" having been created by RouteCreation.yaml (the Routes
# tab's sort row only renders when the list is non-empty), so this flow must
# run after both in the suite.
---
- launchApp:
    clearState: false

- runFlow:
    file: WaitForScreen.yaml
    env:
      screen: Home

- tapOn:
    id: homeMarkersAndRoutes


# Exercise the sort control on the Routes tab. It's a single merged
# TalkBack-announced control (clearAndSetSemantics on the Row makes the
# individual icon/text testTags unreachable), so this taps the whole thing
# once rather than each part separately.
- tapOn:
    id: markersAndRoutesSort

# The screen opens on the Routes tab by default - switch to Markers.
- tapOn:
    id: MarkersTab
- assertVisible:
    id: "LocationItem-A-0"
- assertVisible:
    id: "LocationItem-B-1"

- assertVisible:
    id: "LocationItem-A-.*"
- assertVisible:
    id: "LocationItem-B-.*"

# Exercise the sort control on the Markers tab too.
- tapOn:
    id: markersAndRoutesSort

# Confirm tab navigation works in both directions.
- tapOn:
    id: RoutesTab
- tapOn:
    id: MarkersTab

# Open marker A and edit its annotation, then save.
- tapOn:
    id: "LocationItem-A-.*"
- tapOn:
    id: locationDetailsEditMarker
- tapOn:
    id: notes-clearTextField
    optional: true      # If the notes are empty, then there's no clear text button
- tapOn:
    id: markerAnnotation
- inputText: "Updated by Maestro"
- tapOn:
    id: flexibleAppBarRight

# Saving the edit pops all the way back to Home rather than back to this
# screen, so re-enter before exercising the screen's own back button
# (distinct from the tab bar).
- runFlow:
    file: WaitForScreen.yaml
    env:
      screen: Home
- tapOn:
    id: homeMarkersAndRoutes
- tapOn:
    id: markersAndRoutesBackButton
