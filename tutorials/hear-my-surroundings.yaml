# An audio guide, built by scripts/build-tutorial.py. See docs/developers/audio-tutorials.md.
#
# Each beat is narration, optionally followed by a button press and a window of the app's own
# audio. The narration and the app never talk over each other: the guide is assembled by
# concatenating what was said with what the app then did.

name: hear-my-surroundings
title: Hearing your surroundings with Soundscape

# Where the app stands while the guide is recorded - the first point of this track. Replaying a
# fixed position is what makes the callouts reproducible: re-record after a change and the same
# places are announced.
#
# speed 0 means stand still rather than walk, and these recordings depend on it. A user who is
# moving gets automatic callouts the whole time, so the audio from pressing a button would never be
# surrounded by silence and could not be cut out cleanly.
gpx: app/src/test/resources/gpx/milngavie-centre.gpx
speed: 0

# Nearby Markers has nothing to announce on a device with no markers saved, so the guide creates
# one first. Runs after the replay is in place, so the marker lands where the app is standing.
setup:
  - flow: tutorials/setup/save-marker.yaml

beats:
  - say: >-
      Welcome to Soundscape. This short guide introduces the four buttons along the bottom of the
      home screen, the ones under Hear My Surroundings. Put your headphones on before you start,
      because everything Soundscape tells you is placed in the direction it is coming from.

  - say: >-
      In this recording we are standing on a street in Milngavie, just north of Glasgow, pressing
      each button in turn. Listen for where each place is announced from. A shop on your right is
      spoken from your right.

  - say: >-
      The first button is My Location. Press it at any time and Soundscape tells you where you are,
      which way you are facing, and the nearest junction ahead. Here is what that sounds like.
    tap: homeMyLocation
    listen: 45

  - say: >-
      The second button is Around Me. This one gives you the four things closest to you, one from
      each direction, so you get a sense of what surrounds you.
    tap: homeAroundMe
    listen: 60

  - say: >-
      The third button is Ahead of Me. Rather than looking all around, this tells you what lies in
      the direction you are facing, which is the one you will reach for most while walking.
    tap: homeAheadOfMe
    listen: 60

  - say: >-
      The fourth button is Nearby Markers. It calls out any places you have saved as markers,
      so you can hear when something you care about is close.
    tap: homeNearbyMarkers
    listen: 45

  - say: >-
      That is the whole of Hear My Surroundings. My Location for where you are, Around Me for what
      surrounds you, Ahead of Me for what is coming, and Nearby Markers for the places you saved.
      You can press any of them at any time, and press again to stop the callout.
